<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Pengaturan SPMB | Panel Admin SDN Kalibaru 3</title><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/admin-common.css"><style>body{background:#f5f8f7}.admin-shell{width:min(calc(100% - 32px),760px);margin:0 auto;padding:120px 0 60px}.panel{padding:28px;background:#fff;border:1px solid #e2ebe8;border-radius:22px;box-shadow:0 14px 40px rgba(7,95,83,.08)}.status-card{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px;border-radius:17px;background:#f5f8f7;border:1px solid #e2ebe8}.status-copy h2{margin:0 0 4px;font-size:1.18rem}.status-copy p{margin:0;color:#687875}.status-badge{display:inline-flex;align-items:center;gap:8px;padding:9px 12px;border-radius:999px;font-size:.78rem;font-weight:800;white-space:nowrap}.status-badge::before{content:'';width:8px;height:8px;border-radius:50%;background:currentColor}.status-badge.inactive{background:#ecefee;color:#687875}.status-badge.active{background:#dff5ef;color:#087f6e}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:20px}.secondary{background:#fff!important;color:#087f6e!important;border:1px solid #cfe4df!important}.danger-state{background:#fff!important;color:#8c2d23!important;border:1px solid #e5c9c5!important}.inline-status{font-weight:700;color:#51625f}.inline-status.success{color:#087f6e}.inline-status.error{color:#b42318}html[data-theme="dark"] .status-card{background:#0f211d;border-color:#29413b}html[data-theme="dark"] .status-copy p{color:#a9bbb6}@media(max-width:600px){.status-card{align-items:flex-start;flex-direction:column}}</style></head><body class="admin-page"><header class="site-header"><div class="container header-inner"><a class="brand" href="../index.html"><span>SDN KALIBARU 3</span></a></div></header><main class="admin-shell"><div class="admin-topbar"><div class="admin-topbar-copy"><div class="section-label">Panel Admin</div><h1>Pengaturan SPMB</h1><p>Atur status menu SPMB pada hamburger popup website publik.</p></div><div class="admin-topbar-actions"><a class="button admin-action" href="admin.html">Dashboard</a><a class="button admin-action admin-action-public" href="spmb.html" target="_blank" rel="noopener noreferrer">Lihat Halaman ↗</a><button data-admin-logout class="button admin-action admin-action-logout" type="button">Keluar</button></div></div><section class="panel"><div class="status-card"><div class="status-copy"><h2>Status SPMB</h2><p id="description">Memuat status terbaru...</p></div><span id="badge" class="status-badge inactive">Nonaktif</span></div><div class="actions"><button id="toggle" class="button" type="button" disabled>Memuat...</button><a class="button secondary" href="admin.html">← Kembali</a><span id="status" class="inline-status" role="status" aria-live="polite"></span></div></section></main><script src="../assets/js/admin-session.js"></script><script>
const API='https://offjdeutxvcrybniftyl.supabase.co/functions/v1/admin-spmb-settings',KEY='kb3_contact_admin_token';let active=false;const badge=document.querySelector('#badge'),description=document.querySelector('#description'),toggle=document.querySelector('#toggle'),statusEl=document.querySelector('#status');
async function api(payload){const token=localStorage.getItem(KEY)||'';const response=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(payload)});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error==='Unauthorized'?'Sesi admin tidak valid. Silakan masuk kembali.':(data.error||'Permintaan gagal.'));return data}
function render(){badge.textContent=active?'Aktif':'Nonaktif';badge.className='status-badge '+(active?'active':'inactive');description.textContent=active?'Menu SPMB sedang aktif dan ditandai Aktif pada website publik.':'Menu SPMB tetap tersedia sebagai informasi, tetapi ditandai Nonaktif karena belum memasuki masa SPMB.';toggle.textContent=active?'Nonaktifkan SPMB':'Aktifkan SPMB';toggle.classList.toggle('danger-state',active);toggle.disabled=false}
async function load(){statusEl.textContent='';try{const data=await api({action:'get'});active=Boolean(data.settings?.is_active);render()}catch(error){statusEl.textContent=error.message;statusEl.className='inline-status error'}}
toggle.addEventListener('click',async()=>{toggle.disabled=true;statusEl.textContent='Menyimpan...';statusEl.className='inline-status';try{const data=await api({action:'save',is_active:!active});active=Boolean(data.settings?.is_active);render();statusEl.textContent='Status SPMB berhasil diperbarui.';statusEl.className='inline-status success'}catch(error){toggle.disabled=false;statusEl.textContent=error.message;statusEl.className='inline-status error'}});
load();
</script></body></html>
