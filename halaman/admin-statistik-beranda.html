<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Statistik Beranda | Panel Admin SDN Kalibaru 3</title><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/admin-common.css"><style>body{background:#f5f8f7}.admin-shell{width:min(calc(100% - 32px),900px);margin:0 auto;padding:120px 0 60px}.panel{background:#fff;border:1px solid #e2ebe8;border-radius:22px;box-shadow:0 14px 40px rgba(7,95,83,.08);padding:26px}.stats-form{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}.stats-field{display:grid;gap:7px}.stats-field span{font-size:.8rem;font-weight:800;color:#51625f;text-transform:uppercase;letter-spacing:.04em}.stats-field input{width:100%;padding:14px 15px;border:1px solid #d7e3df;border-radius:13px;background:#fbfdfc;font:inherit;font-size:1.08rem;font-weight:700;color:#17342e}.stats-field input:focus{outline:3px solid rgba(8,127,110,.13);border-color:#087f6e}.note{margin:20px 0 0;padding:16px 18px;border-radius:14px;background:#eef9f6;color:#31534c;font-size:.9rem}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:20px}.secondary{background:#fff!important;color:#087f6e!important;border:1px solid #cfe4df!important}.status{min-height:1.4em;color:#51625f;font-weight:700}.status.success{color:#087f6e}.status.error{color:#b42318}html[data-theme="dark"] body{background:#0d1715}html[data-theme="dark"] .panel{background:#14211e;border-color:#294039}html[data-theme="dark"] .stats-field span{color:#9fb4ae}html[data-theme="dark"] .stats-field input{background:#0f1b18;border-color:#294039;color:#f3faf8}html[data-theme="dark"] .note{background:#17332d;color:#b9d8d0}@media(max-width:640px){.stats-form{grid-template-columns:1fr}}</style></head><body class="admin-page"><header class="site-header"><div class="container header-inner"><a class="brand" href="../index.html"><span>SDN KALIBARU 3</span></a></div></header><main class="admin-shell"><div class="admin-topbar"><div class="admin-topbar-copy"><div class="section-label">Panel Admin</div><h1>Statistik Beranda</h1><p>Edit empat data yang tampil pada bagian Statistik Sekolah di halaman Beranda.</p></div><div class="admin-topbar-actions"><a class="button admin-action" href="admin.html">Dashboard</a><a class="button admin-action admin-action-public" href="../index.html#statistik" target="_blank" rel="noopener noreferrer">Lihat Beranda ↗</a><button data-admin-logout class="button admin-action admin-action-logout" type="button">Keluar</button></div></div><section class="panel"><form id="stats-form"><div class="stats-form"><label class="stats-field"><span>Tahun Pelajaran Aktif</span><input id="school-year" name="school_year" type="text" maxlength="20" placeholder="2026/2027" required></label><label class="stats-field"><span>Jumlah Rombel</span><input id="class-groups" name="class_groups" type="number" min="0" max="200" step="1" required></label><label class="stats-field"><span>Guru &amp; Tendik</span><input id="teachers-staff" name="teachers_staff" type="number" min="0" max="1000" step="1" required></label><label class="stats-field"><span>Jumlah Peserta Didik</span><input id="students" name="students" type="number" min="0" max="10000" step="1" required></label></div><div class="note">Klik <strong>Simpan Perubahan</strong>. Data langsung tersimpan ke sistem dan akan tampil di Beranda tanpa membuka GitHub.</div><div class="actions"><button id="save" class="button" type="submit">Simpan Perubahan →</button><a class="button secondary" href="admin.html">← Kembali</a><span id="status" class="status" role="status" aria-live="polite"></span></div></form></section></main><script src="../assets/js/admin-session.js"></script><script>
const API='https://offjdeutxvcrybniftyl.supabase.co/functions/v1/admin-homepage-statistics';
const TOKEN_KEY='kb3_contact_admin_token';
const fields={school_year:document.querySelector('#school-year'),class_groups:document.querySelector('#class-groups'),teachers_staff:document.querySelector('#teachers-staff'),students:document.querySelector('#students')};
const statusEl=document.querySelector('#status');
const saveButton=document.querySelector('#save');
async function api(payload){const token=localStorage.getItem(TOKEN_KEY)||'';const response=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(payload)});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error==='Unauthorized'?'Sesi admin tidak valid. Silakan masuk kembali.':(data.error||'Permintaan gagal.'));return data}
function setStatus(message,type=''){statusEl.textContent=message;statusEl.className='status'+(type?' '+type:'')}
async function load(){setStatus('Memuat...');try{const data=await api({action:'get'});const s=data.statistics||{};Object.entries(fields).forEach(([key,input])=>{input.value=s[key]??''});setStatus('Data siap diedit.')}catch(error){setStatus(error.message,'error')}}
document.querySelector('#stats-form').addEventListener('submit',async(event)=>{event.preventDefault();if(!event.currentTarget.reportValidity())return;saveButton.disabled=true;setStatus('Menyimpan...');try{const payload={action:'save',school_year:fields.school_year.value.trim(),class_groups:Number(fields.class_groups.value),teachers_staff:Number(fields.teachers_staff.value),students:Number(fields.students.value)};const data=await api(payload);const s=data.statistics||payload;Object.entries(fields).forEach(([key,input])=>{input.value=s[key]??input.value});setStatus('Perubahan berhasil disimpan dan sudah aktif di Beranda.','success')}catch(error){setStatus(error.message,'error')}finally{saveButton.disabled=false}});
load();
</script></body></html>
